<title>ใจดี</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {
  --paper: #f2f5f3;
  --surface: #ffffff;
  --surface-2: #eaefec;
  --ink: #1c2624;
  --ink-soft: #4b5a56;
  --line: #d7e0dc;
  --accent: #2f6f63;
  --accent-ink: #ffffff;
  --accent-soft: #e2ede9;
  --danger: #a8482f;
  --danger-soft: #f5e4de;
  --danger-ink: #ffffff;
  --badge-none-bg: #dcece4; --badge-none-fg: #2f6f4a;
  --badge-mild-bg: #f2ebc9; --badge-mild-fg: #8a6d1f;
  --badge-moderate-bg: #f5ddc0; --badge-moderate-fg: #a05a1c;
  --shadow: 0 1px 2px rgba(28, 38, 36, 0.06), 0 8px 24px -12px rgba(28, 38, 36, 0.18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111816; --surface: #19211f; --surface-2: #212b28; --ink: #e3ebe8; --ink-soft: #a5b4af; --line: #2d3a36;
  --accent: #74b8a8; --accent-ink: #0d1412; --accent-soft: #1d2f2a; --danger: #e48c70; --danger-soft: #3a241d; --danger-ink: #1a0e0a;
  --badge-none-bg: #1f3329; --badge-none-fg: #8fd0a8; --badge-mild-bg: #352f17; --badge-mild-fg: #e2c76a;
  --badge-moderate-bg: #3a2a17; --badge-moderate-fg: #eda76a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #111816; --surface: #19211f; --surface-2: #212b28; --ink: #e3ebe8; --ink-soft: #a5b4af; --line: #2d3a36;
  --accent: #74b8a8; --accent-ink: #0d1412; --accent-soft: #1d2f2a; --danger: #e48c70; --danger-soft: #3a241d; --danger-ink: #1a0e0a;
  --badge-none-bg: #1f3329; --badge-none-fg: #8fd0a8; --badge-mild-bg: #352f17; --badge-mild-fg: #e2c76a;
  --badge-moderate-bg: #3a2a17; --badge-moderate-fg: #eda76a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}


* { box-sizing: border-box; }
/* v28 ให้ attribute hidden ซ่อนได้จริงเสมอ (เดิม .field-checkbox { display:flex } ทับ hidden ทำให้ช่องผู้ปกครองโผล่ตลอด) */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Segoe UI", "Sarabun", system-ui, sans-serif;
  line-height: 1.65;
}

a { color: var(--accent); }

.app-shell { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 4rem; min-height: 100%; }

.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 0;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 0.5rem;
}
.navbar .brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
.badge-anonymous { background: var(--surface-2); color: var(--ink-soft); font-weight: 600; cursor: help; }
.navbar nav { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.navbar nav a, .navbar nav button {
  font-family: inherit; font-size: 0.86rem; color: var(--ink-soft); text-decoration: none;
  background: none; border: none; padding: 0.4rem 0.65rem; border-radius: 6px; cursor: pointer;
}
.navbar nav a:hover, .navbar nav button:hover { background: var(--surface-2); color: var(--ink); }
.navbar nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem 1.6rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }

h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
h2 { font-size: 1.2rem; margin: 0 0 0.75rem; }
p.subtitle { color: var(--ink-soft); margin: 0 0 1.5rem; }

.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.86rem; color: var(--ink-soft); margin-bottom: 0.35rem; }
.field input, .field select, .field textarea {
  width: 100%; padding: 0.65rem 0.8rem; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 0.95rem; background: var(--paper); color: var(--ink);
}
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.field-checkbox { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.86rem; color: var(--ink-soft); }
.field-checkbox input { width: auto; margin-top: 0.2rem; }

.btn {
  display: inline-block; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
  padding: 0.7rem 1.3rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { opacity: 0.92; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface-2); color: var(--ink); }
.btn-block { width: 100%; text-align: center; }

.error-text { color: var(--danger); font-size: 0.88rem; margin: -0.4rem 0 1rem; }
.link-row { margin-top: 1rem; font-size: 0.9rem; color: var(--ink-soft); }

.divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.4rem 0 1rem; color: var(--ink-soft); font-size: 0.82rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.hotline-banner {
  display: flex; align-items: center; gap: 1rem; background: var(--danger-soft); border: 1px solid var(--danger);
  border-radius: 12px; padding: 1.1rem 1.3rem; margin-bottom: 1.5rem;
}
.hotline-banner .icon { font-size: 1.6rem; }
.hotline-banner .text { flex: 1; font-size: 0.92rem; color: var(--ink); }
.hotline-banner .call-btn { background: var(--danger); color: var(--danger-ink); text-decoration: none; font-weight: 700; padding: 0.6rem 1.1rem; border-radius: 8px; white-space: nowrap; }

.badge { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; }
.badge-none { background: var(--badge-none-bg); color: var(--badge-none-fg); }
.badge-mild { background: var(--badge-mild-bg); color: var(--badge-mild-fg); }
.badge-moderate { background: var(--badge-moderate-bg); color: var(--badge-moderate-fg); }
.badge-severe { background: var(--danger-soft); color: var(--danger); }

.question-block { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
.question-block:last-child { border-bottom: none; }
.question-block .q-text { font-weight: 500; margin-bottom: 0.7rem; }
.option-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.option-pill {
  flex: 1; min-width: 130px; text-align: center; padding: 0.55rem 0.6rem; border: 1px solid var(--line);
  border-radius: 8px; font-size: 0.85rem; cursor: pointer; background: var(--paper); color: var(--ink-soft);
}
.option-pill.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.progress-bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 1.5rem; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }

.history-item { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; cursor: pointer; }
.history-item:last-child { border-bottom: none; }
.history-item .date { color: var(--ink-soft); font-size: 0.85rem; }
.history-item .score { font-weight: 600; }

.chat-window { display: flex; flex-direction: column; gap: 0.7rem; min-height: 360px; max-height: 60vh; overflow-y: auto; padding: 0.3rem 0.2rem; margin-bottom: 1rem; }
.msg { max-width: 78%; padding: 0.6rem 0.85rem; border-radius: 14px; font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 4px; }

.chat-input-row { display: flex; gap: 0.6rem; }
.chat-input-row input { flex: 1; }

/* การ์ดประเมินความพึงพอใจ — ให้เด่นกว่าการ์ดปกติ เพื่อดึงความสนใจหลังคุยไปสักพัก */
@keyframes satisfaction-pop-in {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.satisfaction-card {
  border: 2px solid var(--accent);
  background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 65%);
  box-shadow: 0 2px 4px rgba(28, 38, 36, 0.08), 0 14px 34px -14px rgba(47, 111, 99, 0.45);
  animation: satisfaction-pop-in 0.35s ease-out;
  text-align: center;
}
.satisfaction-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin: 0 0 0.35rem; }
.satisfaction-options { display: flex; gap: 0.55rem; flex-wrap: wrap; justify-content: center; margin-bottom: 0.9rem; }
.satisfaction-pill {
  min-width: 64px; padding: 0.65rem 0.5rem; border: 2px solid var(--accent); border-radius: 10px;
  background: var(--surface); color: var(--accent); font-family: inherit; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
}
.satisfaction-pill:hover { background: var(--accent); color: var(--accent-ink); transform: translateY(-2px); }
.satisfaction-pill:active { transform: translateY(0); }
.skip-link { background: none; border: none; color: var(--ink-soft); font-family: inherit; font-size: 0.82rem; text-decoration: underline; cursor: pointer; padding: 0.2rem; }
.skip-link:hover { color: var(--ink); }

/* ป้ายลอย (toast) เช่นข้อความขอบคุณหลังทำแบบประเมินเสร็จ — โผล่มาแป๊บนึงแล้วหายไปเอง */
.toast {
  position: fixed;
  top: calc(1.25rem + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translate(-50%, -14px);
  background: var(--accent);
  color: var(--accent-ink);
  padding: 0.75rem 1.4rem;
  border-radius: 999px;
  box-shadow: var(--shadow);
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
  z-index: 1000;
  opacity: 0;
  max-width: calc(100% - 2.5rem);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.toast-show { opacity: 1; transform: translate(-50%, 0); }
.toast.toast-hide { opacity: 0; transform: translate(-50%, -14px); }

.notice { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 0.88rem; color: var(--ink); margin-bottom: 1.5rem; }
.empty-state { text-align: center; color: var(--ink-soft); padding: 2rem 1rem; }
pre.recommendation { white-space: pre-wrap; font-family: inherit; font-size: 0.92rem; color: var(--ink); margin: 0; }

/* ปุ่ม action cards ใต้คำตอบแชทบอท / หน้าผลประเมิน */
.action-cards { display: flex; flex-wrap: wrap; gap: 0.5rem; align-self: flex-start; max-width: 92%; margin: 0.1rem 0 0.4rem; }
.action-card {
  display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.85rem; border-radius: 999px;
  border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 0.86rem;
  font-weight: 600; text-decoration: none; cursor: pointer;
}
.action-card:hover { background: var(--accent-soft); }
.action-hotline { border-color: var(--danger); color: var(--danger); }
.action-hotline:hover { background: var(--danger-soft); }
.action-hotline .num { font-weight: 700; white-space: nowrap; }
.action-selfcare { display: block; border-radius: 12px; }
.action-selfcare summary { cursor: pointer; list-style: none; }
.action-selfcare summary::-webkit-details-marker { display: none; }
.action-selfcare p { margin: 0.5rem 0 0.1rem; font-weight: 400; color: var(--ink); line-height: 1.55; }

/* v27 ปรับให้ใหญ่ขึ้นบนจอกว้าง (แท็บเล็ต/คอมพิวเตอร์) โดยมือถือยังคงขนาดเดิม */
@media (min-width: 640px) {
  body { font-size: 1.05rem; }
  .app-shell { max-width: 880px; }
  h1 { font-size: 2rem; }
  h2 { font-size: 1.35rem; }
  .card { padding: 2rem 2.3rem; border-radius: 18px; }
  .btn { font-size: 1.02rem; padding: 0.8rem 1.6rem; }
  .field input, .field select, .field textarea { font-size: 1rem; padding: 0.75rem 0.9rem; }
  .chat-window { min-height: 420px; max-height: 68vh; gap: 0.9rem; }
  .msg { font-size: 1rem; max-width: 70%; padding: 0.75rem 1.05rem; }
  .option-pill { font-size: 0.95rem; padding: 0.7rem 0.8rem; }
  .action-card { font-size: 0.92rem; padding: 0.6rem 1rem; }
  .hotline-banner .text { font-size: 0.98rem; }
}

@media (min-width: 1024px) {
  .app-shell { max-width: 980px; }
  .chat-window { max-height: 72vh; }
  .msg { max-width: 62%; }
}

/* v20 หน้าขอความยินยอม */
.consent-box { background: var(--surface-2); border-radius: 10px; padding: 0.9rem 1.1rem; margin: 1rem 0 1.2rem; font-size: 0.9rem; }
.consent-box p { margin: 0.35rem 0; }
.consent-age { border: none; padding: 0; margin: 0 0 1rem; }
.consent-age legend { font-weight: 600; margin-bottom: 0.4rem; }
.consent-age .radio { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; font-weight: 400; }
.consent-age .radio input { width: auto; }

.proto-banner { background: var(--surface-2); color: var(--ink-soft); font-size: 0.8rem; line-height: 1.5; border-bottom: 1px solid var(--line);
  padding-block: 0.55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
.proto-banner strong { color: var(--ink); }
.proto-banner .num { font-weight: 700; color: var(--danger); user-select: all; }
input, select, textarea { background: var(--surface); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>

      if (intent === "vent" && ti.needs_clarify && ["reflect", "decision"].includes(mgr.action)) intent = "clarify";

    const tips = selfHarm || sev === "severe" ? urgent.concat(base.slice(0, 2)) : sev === "moderate" ? base.concat(["ลองปรึกษาผู้เชี่ยวชาญด้านสุขภาพจิตเพื่อรับคำแนะนำเพิ่มเติม"]) : base;
    return { risk_label: label, risk_probability: Math.round(Math.min(1, Math.max(0, total / 27)) * 1000) / 1000, summary_text: summary, recommendation_text: tips, model_name: "rule-based", model_version: "v26-web" };
  }

    }],
    ["POST", /^\/api\/auth\/login$/, false, 200, async (u, p, b) => {
      const email = (b.email || "").trim().toLowerCase(), pw = b.password || "";
      if (!email || !pw) throw new ApiError(400, "กรุณากรอกอีเมลและรหัสผ่าน");
      const user = Object.values(db.users).find((x) => x.email === email);
      if (!user || (await hash(pw, user.password_hash.split("$")[0])) !== user.password_hash) throw new ApiError(401, "อีเมลหรือรหัสผ่านไม่ถูกต้อง");
      return { token: session(user.user_id), user: publicUser(user, ["user_id", "display_name", "email", "is_anonymous"]) };
    }],
    ["POST", /^\/api\/auth\/anonymous$/, false, 201, (u, p, b) => {
      const user = newUser({ display_name: (b.display_name || "").trim() || "ผู้ใช้นิรนาม", email: null, password_hash: "", is_anonymous: 1 });
      return { token: session(user.user_id), user: publicUser(user, ["user_id", "display_name", "is_anonymous"]) };
    }],
    ["GET", /^\/api\/users\/me$/, true, 200, (u) => publicUser(db.users[u], ["user_id", "display_name", "email", "birth_date", "gender", "is_anonymous", "emergency_contact_name", "emergency_contact_phone", "created_at"])],
    ["PATCH", /^\/api\/users\/me$/, true, 200, (u, p, b) => {
      const user = db.users[u];
      for (const f of ["display_name", "birth_date", "gender", "emergency_contact_name", "emergency_contact_phone"]) if (b[f] !== undefined && b[f] !== null) user[f] = b[f];
      user.updated_at = now();
      return publicUser(user, ["user_id", "display_name", "email", "birth_date", "gender", "emergency_contact_name", "emergency_contact_phone"]);
    }],
    ["GET", /^\/api\/assessments\/questions$/, true, 200, () => ({ questions: QUESTIONS, options: OPTIONS })],
    ["POST", /^\/api\/assessments$/, true, 201, (u, p, b) => {
      const answers = b.answers || [];
      if (answers.length !== 9) throw new ApiError(400, "กรุณาตอบให้ครบทั้ง 9 ข้อ");
      for (const a of answers) if (!QUESTIONS.some((q) => q.question_no === a.question_no) || !OPTIONS.some((o) => o.option_value === a.option_value)) throw new ApiError(400, "คำตอบไม่ถูกต้อง");
      const r = J.scoreAssessment(answers), an = J.analyzeFallback(r.total_score, r.severity_level, r.self_harm_risk_flag), ts = now();
      const rec = { assessment_id: uid(), user_id: u, status: "completed", started_at: ts, completed_at: ts, total_score: r.total_score, severity_level: r.severity_level,
                    self_harm_risk_flag: r.self_harm_risk_flag ? 1 : 0, answers: answers.map((a) => ({ question_no: a.question_no, option_value: a.option_value })),
                    analysis: { risk_label: an.risk_label, risk_probability: an.risk_probability, summary_text: an.summary_text, recommendation_text: an.recommendation_text, model_name: an.model_name, created_at: ts } };
      db.assessments.push(rec);
      return { assessment_id: rec.assessment_id, total_score: r.total_score, severity_level: r.severity_level, severity_label: SEV[r.severity_level],
               self_harm_risk_flag: r.self_harm_risk_flag, ai_mode: "rule-based-fallback",
               analysis: { risk_label: an.risk_label, risk_probability: an.risk_probability, summary_text: an.summary_text, recommendation_text: an.recommendation_text },
               show_hotline_banner: r.self_harm_risk_flag, ...J.buildAssessmentOutput(r.total_score, r.severity_level, q9(answers), an.summary_text) };
    }],
    ["GET", /^\/api\/assessments$/, true, 200, (u) => db.assessments.filter((a) => a.user_id === u && a.status === "completed")
      .sort((a, b) => (a.completed_at < b.completed_at ? 1 : -1))
      .map((a) => ({ assessment_id: a.assessment_id, total_score: a.total_score, severity_level: a.severity_level, self_harm_risk_flag: a.self_harm_risk_flag, started_at: a.started_at, completed_at: a.completed_at, risk_label: a.analysis.risk_label }))],
    ["GET", /^\/api\/assessments\/(?<id>[^/]+)$/, true, 200, (u, p) => {
      const a = db.assessments.find((x) => x.assessment_id === p.id && x.user_id === u);
      if (!a) throw new ApiError(404, "ไม่พบข้อมูลการประเมินนี้");
      const answers = a.answers.map((x) => ({ question_no: x.question_no, question_text_th: QUESTIONS.find((q) => q.question_no === x.question_no).question_text_th,
        option_value: x.option_value, option_text_th: OPTIONS.find((o) => o.option_value === x.option_value).option_text_th })).sort((x, y) => x.question_no - y.question_no);
      const { answers: _drop, analysis, ...rest } = a;
      return { ...rest, severity_label: SEV[a.severity_level], answers, analysis, ...J.buildAssessmentOutput(a.total_score, a.severity_level, q9(answers), analysis.summary_text) };
    }],
    ["POST", /^\/api\/chat\/conversations$/, true, 201, (u) => {
      const id = uid(), ts = now();
      db.conversations[id] = { conversation_id: id, user_id: u, status: "active", started_at: ts, ended_at: null, messages: [], shown: [] };
      return { conversation_id: id, status: "active", started_at: ts };
    }],
    ["GET", /^\/api\/chat\/conversations$/, true, 200, (u) => Object.values(db.conversations).filter((c) => c.user_id === u)
      .sort((a, b) => (a.started_at < b.started_at ? 1 : -1)).map((c) => ({ conversation_id: c.conversation_id, status: c.status, started_at: c.started_at, ended_at: c.ended_at }))],
    ["GET", /^\/api\/chat\/conversations\/(?<id>[^/]+)\/messages$/, true, 200, (u, p) => conv(p.id, u).messages],
    ["POST", /^\/api\/chat\/conversations\/(?<id>[^/]+)\/messages$/, true, 201, (u, p, b) => {
      // แปลจาก h_send_message ใน server.py (ไม่มีด่าน Gemini)
      const content = (b.content || "").trim();
      if (!content) throw new ApiError(400, "กรุณาพิมพ์ข้อความ");
      const c = conv(p.id, u), t0 = performance.now();
      const before = c.messages.slice(-30).map((m) => ({ sender: m.sender, content: m.content }));
      const prevUser = before.filter((m) => m.sender === "user").map((m) => m.content);
      const checked = before.some((m) => m.sender === "ai" && m.content === J.CHECK_IN_REPLY[1]);
      const age = ageGroup(u);
      let crisis = J.assess(content, prevUser, age, !checked);
      if (crisis.reply_kind === null && J.answeredYesToCheck(before, content)) {
        crisis = J.assess(content, prevUser, age, false, () => "MODERATE");
        crisis.source = "check_answer";
        crisis.reasons = crisis.reasons.map((r) => r.replace("crisis_gemini", "crisis_check_answer"));
      }
      const sentiment = crisis.reply_kind ? "crisis" : J.detectSentiment(content);
      c.messages.push({ message_id: db.seq++, sender: "user", content, sentiment_flag: sentiment, created_at: now() });
      if (crisis.reply_kind === "crisis" || crisis.reply_kind === "abuse") c.status = "escalated";
      const history = c.messages.slice(-30).map((m) => ({ sender: m.sender, content: m.content }));
      const reply = J.replyToChat(history, sentiment, crisis);
      let parts = reply.reply_parts && reply.reply_parts.length ? reply.reply_parts : [reply.reply_text];
      if (sentiment !== "crisis" && parts.length > J.MAX_BUBBLES) parts = parts.slice(0, J.MAX_BUBBLES - 1).concat(parts.slice(-1));
      const aiMessages = parts.map((part) => { const m = { message_id: db.seq++, sender: "ai", content: part, sentiment_flag: "normal", created_at: now() }; c.messages.push(m); return m; });
      reply.reply_parts = aiMessages.map((m) => m.content); reply.reply_text = reply.reply_parts.join("\n\n");
      const output = J.buildChatOutput(reply, crisis, sentiment, latestAssessment(u), new Set(c.shown));
      for (const card of output.user_response.action_cards) if (!c.shown.includes(card.type)) c.shown.push(card.type);
      const a = output.analytics;
      console.log(`⏱️ ${(performance.now() - t0).toFixed(0)} ms | intent=${a.detected_intent} topic=${a.detected_topic} (${a.topic_source}) crisis=${a.crisis_level}${reply.dialogue_id ? " | คลังบทสนทนา: " + reply.dialogue_id : ""}`);
      return { user_message_sentiment: sentiment, show_hotline_banner: sentiment === "crisis", ai_message: aiMessages[aiMessages.length - 1], ai_messages: aiMessages, analytics: output.analytics, user_response: output.user_response };
    }],
    ["POST", /^\/api\/chat\/conversations\/(?<id>[^/]+)\/satisfaction$/, true, 201, (u, p, b) => {
      const bucket = (b.bucket || "").trim();
      if (!["0-1", "2-3", "4-5", "6-8", "9-10"].includes(bucket)) throw new ApiError(400, "กรุณาเลือกระดับความพึงพอใจที่ถูกต้อง");
      conv(p.id, u); db.ratings[p.id] = { bucket, created_at: now() };
      return { ok: true, bucket };
    }],
    ["GET", /^\/api\/notifications$/, true, 200, () => []],
    ["PATCH", /^\/api\/notifications\/(?<id>[^/]+)\/read$/, true, 200, () => { throw new ApiError(404, "ไม่พบการแจ้งเตือนนี้"); }],
    ["GET", /^\/api\/notifications\/preferences$/, true, 200, (u) => ({ ...db.prefs[u] })],
    ["PUT", /^\/api\/notifications\/preferences$/, true, 200, (u, p, b) => {
      const cur = db.prefs[u];
      if (b.reminder_enabled !== undefined && b.reminder_enabled !== null) cur.reminder_enabled = b.reminder_enabled ? 1 : 0;
      if (b.day_of_week !== undefined && b.day_of_week !== null) cur.day_of_week = b.day_of_week;
      if (b.time_of_day !== undefined && b.time_of_day !== null) cur.time_of_day = b.time_of_day;
      return { ...cur };
    }],
  ];

  async function handle(method, path, headers, body) {
    for (const [m, re, auth, okStatus, fn] of routes) {
      if (m !== method) continue;
      const match = re.exec(path); if (!match) continue;
      let userId = null;
      if (auth) {
        const h = headers.get ? headers.get("Authorization") : headers.Authorization;
        const token = h && h.startsWith("Bearer ") ? h.slice(7) : null;
        userId = token ? db.sessions[token] : null;
        if (!userId || !db.users[userId]) return [401, { error: "กรุณาเข้าสู่ระบบก่อนใช้งาน" }];
      }
      try {
        const out = await fn(userId, match.groups || {}, body || {});
        save();
        return [okStatus, out];
      } catch (err) {
        if (err instanceof ApiError) return [err.status, { error: err.message }];
        console.error(err);
        return [500, { error: "เกิดข้อผิดพลาดบางอย่างในระบบ กรุณาลองใหม่" }];
      }
    }
    return [404, { error: "ไม่พบ endpoint นี้" }];
  }

  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async function (input, init = {}) {
    const url = typeof input === "string" ? input : input.url;
    const path = url.startsWith("/api/") ? url : (url.match(/^https?:\/\/[^/]+(\/api\/.*)$/) || [])[1];
    if (!path) return realFetch(input, init);
    let body = {};
    try { body = init.body ? JSON.parse(init.body) : {}; } catch (e) { body = {}; }
    const [status, data] = await handle((init.method || "GET").toUpperCase(), path.split("?")[0], new Headers(init.headers || {}), body);
    return new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
  };

  window.JaideeWeb = {
    reset() { db = { users: {}, sessions: {}, assessments: [], conversations: {}, prefs: {}, ratings: {}, seq: 1 }; save(); },
    storageOk,
  };
  setTimeout(() => { try { J.warm(); } catch (e) { console.warn(e); } }, 50); // เตรียมตัวเทียบ NLP ไว้ก่อน ข้อความแรกจะได้ไม่ช้า
})();

</script>
<script>
// แอปหน้าเดียว (SPA) เขียนด้วย vanilla JavaScript ล้วนๆ ไม่มี React/build step
// ทำงานคู่กับ backend Python ที่อยู่ origin เดียวกัน (ไม่ต้องกังวลเรื่อง CORS)

const API_BASE = "/api";
const app = document.getElementById("app");

// v20 การเลือกเรื่องเก็บข้อมูลวิจัย {research_consent, age_band, guardian_ack} (null = ยังไม่ได้เลือก)
function loadResearchChoice() {
  try { return JSON.parse(localStorage.getItem("research_choice") || "null"); } catch (e) { return null; }
}
function saveResearchChoice(choice) {
  state.research = choice;
  try { localStorage.setItem("research_choice", JSON.stringify(choice)); } catch (e) { /* ใช้ต่อในหน่วยความจำ */ }
}

const state = {
  research: loadResearchChoice(),
  token: localStorage.getItem("token") || null,
  user: JSON.parse(localStorage.getItem("user") || "null"),
  view: "login",
  params: {},
};

const SEVERITY_BADGE = { none: "badge-none", mild: "badge-mild", moderate: "badge-moderate", severe: "badge-severe" };
const SEVERITY_LABEL = { none: "ไม่มีอาการ", mild: "ระดับน้อย", moderate: "ระดับปานกลาง", severe: "ระดับรุนแรง" };
const DAY_LABELS = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

// ---------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------
function setAuth(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem("token", token);
  localStorage.setItem("user", JSON.stringify(user));
}

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  navigate("login");
}

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers["Authorization"] = `Bearer ${state.token}`;
  const res = await fetch(API_BASE + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));

  // เคยเกิดปัญหาว่า token เก่าที่ค้างอยู่ใน localStorage (เช่น เซิร์ฟเวอร์ถูกรีสตาร์ทด้วย
  // ฐานข้อมูลใหม่ หรือ session หมดอายุ) ทำให้ navbar ยังโชว์เหมือนล็อกอินอยู่ (เพราะแค่เช็คว่ามี
  // token เก็บไว้ไหม ไม่ได้เช็คว่า token นั้นยังใช้ได้จริงหรือเปล่า) แต่พอเรียก API จริงกลับโดน
  // ปฏิเสธ ทำให้หน้าจอค้างอยู่ในสภาพ "ดูเหมือนล็อกอินแต่ใช้งานไม่ได้จริง" — ถ้าเจอ 401 ระหว่างที่มี
  // token อยู่ (และไม่ใช่หน้า auth เอง เช่น login ผิดรหัสผ่าน) ให้เคลียร์ค่าที่ค้างแล้วพากลับไป
  // หน้าล็อกอินให้เลย จะได้ไม่งงว่าทำไมกดอะไรก็บอกว่าให้ล็อกอินทั้งที่หน้าตาเหมือนล็อกอินอยู่
  if (res.status === 401 && state.token && !path.startsWith("/auth/")) {
    state.token = null;
    state.user = null;
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    navigate("login");
    throw new Error("เซสชันหมดอายุหรือไม่ถูกต้อง กรุณาเข้าสู่ระบบอีกครั้ง");
  }

  if (!res.ok) throw new Error(data.error || "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
  return data;
}

function navigate(view, params = {}) {
  state.view = view;
  state.params = params;
  render();
  window.scrollTo(0, 0);
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

function fmtDate(iso, opts = { dateStyle: "long" }) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("th-TH", opts);
}

// ป้ายข้อความลอย (toast) ที่โผล่มาแป๊บนึงแล้วหายไปเอง — ต่อ DOM เข้ากับ document.body ตรงๆ
// (ไม่ผ่าน wrap()/app.innerHTML) เพื่อไม่ให้หายไปก่อนเวลาถ้ามีการ re-render หน้าเกิดขึ้นระหว่างนั้น
function showToast(message, durationMs = 3200) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  document.body.appendChild(toast);

  requestAnimationFrame(() => toast.classList.add("toast-show")); // บังคับ reflow ก่อนเพื่อให้ transition ทำงาน

  setTimeout(() => {
    toast.classList.remove("toast-show");
    toast.classList.add("toast-hide");
    setTimeout(() => toast.remove(), 350); // รอ transition จางหายจบก่อนค่อยลบออกจาก DOM จริงๆ
  }, durationMs);
}

function hotlineBannerHtml(message) {
  const text = message || "หากคุณกำลังรู้สึกไม่ปลอดภัยหรือมีความคิดทำร้ายตัวเอง คุณไม่ต้องเผชิญเรื่องนี้คนเดียว";
  return `
    <div class="hotline-banner" role="alert">
      <span class="icon" aria-hidden="true">☎️</span>
      <div class="text">${escapeHtml(text)} สายด่วนสุขภาพจิต 1323 พร้อมรับฟังตลอด 24 ชั่วโมง ไม่มีค่าใช้จ่าย</div>
      <a class="call-btn" href="tel:1323">โทร 1323</a>
    </div>`;
}

// ปุ่ม action cards จาก user_response.action_cards ของ backend (สายด่วน / ดูแลตัวเอง / ไปทำแบบประเมิน)
function actionCardsHtml(cards) {
  if (!cards || cards.length === 0) return "";
  const items = cards
    .map((c) => {
      if (c.type === "HOTLINE" && c.contact_number) {
        const tel = c.contact_number.replace(/[^0-9]/g, "");
        return `<a class="action-card action-hotline" href="tel:${tel}">☎️ ${escapeHtml(c.title)}<span class="num">${escapeHtml(c.contact_number)}</span></a>`;
      }
      if (c.type === "PHQ9_ASSESSMENT") {
        return `<a class="action-card" href="#" data-nav="assessment">📋 ${escapeHtml(c.title)}</a>`;
      }
      if (c.type === "SELF_CARE") {
        return `<details class="action-card action-selfcare">
            <summary>🌬️ ${escapeHtml(c.title)}</summary>
            <p>หายใจเข้าทางจมูกช้าๆ นับ 1-2-3-4 กลั้นไว้นับ 1-2 แล้วค่อยๆ ผ่อนออกทางปาก นับ 1-2-3-4-5-6 ทำสัก 5 รอบ สังเกตว่าไหล่และมือค่อยๆ คลายลง</p>
          </details>`;
      }
      return "";
    })
    .join("");
  return `<div class="action-cards">${items}</div>`;
}

function navbarHtml() {
  if (!state.token) return "";
  const item = (view, label) => `<a href="#" data-nav="${view}" class="${state.view === view ? "active" : ""}">${label}</a>`;
  const anonymousBadge = state.user?.is_anonymous
    ? `<span class="badge badge-anonymous" title="บัญชีนี้ไม่ผูกกับอีเมลหรือชื่อจริง ถ้าล้างข้อมูลเบราว์เซอร์จะกลับเข้าบัญชีนี้ไม่ได้อีก">🕶️ โหมดไม่ระบุตัวตน</span>`
    : "";
  return `
    <header class="navbar">
      <a href="#" data-nav="dashboard" class="brand">🌿 ใจดี</a>
      ${anonymousBadge}
      <nav>
        ${item("dashboard", "หน้าหลัก")}
        ${item("assessment", "ทำแบบประเมิน")}
        ${item("history", "ประวัติ")}
        ${item("chat", "แชทบอท")}
        ${item("settings", "ตั้งค่า")}
        <button data-action="logout">ออกจากระบบ</button>
      </nav>
    </header>`;
}

function wrap(innerHtml) {
  app.innerHTML = `<div class="app-shell">${navbarHtml()}${innerHtml}</div>`;
  bindGlobalEvents();
}

function bindGlobalEvents() {
  app.querySelectorAll("[data-nav]").forEach((el) =>
    el.addEventListener("click", (e) => {
      e.preventDefault();
      navigate(el.dataset.nav);
    })
  );
  const logoutBtn = app.querySelector('[data-action="logout"]');
  if (logoutBtn) logoutBtn.addEventListener("click", logout);
}

// ---------------------------------------------------------------------
// render dispatcher
// ---------------------------------------------------------------------
function render() {
  if (!state.token && !["login", "register", "consent"].includes(state.view)) {
    state.view = "login";
  }
  if (!state.token && !state.research) state.view = "consent"; // v20 ต้องเลือกเรื่องเก็บข้อมูลก่อนเริ่มใช้
  const renderers = {
    consent: renderConsent,
    login: renderLogin,
    register: renderRegister,
    dashboard: renderDashboard,
    assessment: renderAssessment,
    result: renderResult,
    history: renderHistory,
    chat: renderChat,
    settings: renderSettings,
  };
  (renderers[state.view] || renderLogin)();

          <p><strong>สิ่งที่ไม่เก็บ</strong> ชื่อ อีเมล วันเกิด และรหัสบัญชีจริงของคุณ ระบบใช้รหัสสุ่มแทน</p>
          <p><strong>ใครเห็น</strong> เฉพาะผู้พัฒนาโครงงานและครูที่ปรึกษา ใช้เพื่อวัดผลโครงงานเท่านั้น</p>
          <p><strong>เลือกได้เสมอ</strong> ไม่ยินยอมก็ใช้แอปได้ทุกอย่าง และเปลี่ยนใจได้ภายหลังที่หน้าตั้งค่า</p>
          <p>ถ้าพิมพ์ข้อความที่แสดงว่าอาจไม่ปลอดภัย แอปจะแสดงเบอร์สายด่วนให้ แต่ไม่มีใครเฝ้าอ่านข้อความแบบทันที ถ้าต้องการความช่วยเหลือตอนนี้ โทร <strong>1323</strong> หรือ <strong>1669</strong></p>
        </div>
        <fieldset class="field consent-age">
          <legend>อายุของคุณ</legend>
          <label class="radio"><input type="radio" name="age_band" value="under18" id="age-under18" /> ต่ำกว่า 18 ปี</label>
          <label class="radio"><input type="radio" name="age_band" value="18plus" id="age-18plus" /> 18 ปีขึ้นไป</label>
        </fieldset>
        <div class="field field-checkbox" id="guardian-row" hidden>
          <input type="checkbox" id="guardian_ack" />
          <label for="guardian_ack" style="margin:0">ผู้ปกครองของฉันรับทราบและอนุญาตให้เข้าร่วมแล้ว</label>

        <div class="field field-checkbox">
          <input type="checkbox" id="research_consent" />
          <label for="research_consent" style="margin:0">ฉันอ่านแล้ว และยินยอมให้เก็บข้อมูลตามที่เขียนไว้ด้านบน</label>
        </div>
        <p class="error-text" id="consent-error" hidden></p>
        <button class="btn btn-block" id="consent-yes" type="button" disabled>ยินยอมและเริ่มใช้</button>

      </div>
    </div>`;
  const q = (sel) => app.querySelector(sel);
  const ageBand = () => (q("#age-under18").checked ? "under18" : q("#age-18plus").checked ? "18plus" : null);
  const update = () => {
    const band = ageBand();
    q("#guardian-row").hidden = band !== "under18";
    q("#consent-yes").disabled = !(q("#research_consent").checked && (band === "18plus" || (band === "under18" && q("#guardian_ack").checked)));
  };
  ["#age-under18", "#age-18plus", "#guardian_ack", "#research_consent"].forEach((s) => q(s).addEventListener("change", update));

      await api("PUT", "/research/consent", choice).catch(() => {});
      navigate("settings");
    } else navigate(state.token ? "dashboard" : state.research ? "login" : "consent");
  };
  q("#consent-yes").addEventListener("click", () => done({ research_consent: true, age_band: ageBand(), guardian_ack: q("#guardian_ack").checked }));
  q("#consent-no").addEventListener("click", () => done({ research_consent: false, age_band: ageBand(), guardian_ack: false }));
}

async function renderAssessment() {
  wrap(`<p class="subtitle">กำลังโหลด...</p>`);
  const { questions, options } = await api("GET", "/assessments/questions");
  const answers = {}; // question_no -> option_value

  function questionsHtml() {
    return questions
      .map(
        (q) => `
      <div class="question-block">
        <p class="q-text">${q.question_no}. ${escapeHtml(q.question_text_th)}</p>
        <div class="option-row">
          ${options
            .map(
              (o) => `<button type="button" class="option-pill ${answers[q.question_no] === o.option_value ? "selected" : ""}"
                        data-qno="${q.question_no}" data-value="${o.option_value}">${escapeHtml(o.option_text_th)}</button>`
            )
            .join("")}
        </div>
      </div>`
      )
      .join("");
  }

  function paint() {
    const answeredCount = Object.keys(answers).length;
    wrap(`
      <h1>แบบประเมินโรคซึมเศร้า 9Q</h1>
      <p class="subtitle">เลือกคำตอบที่ตรงกับความรู้สึกของคุณในช่วง 2 สัปดาห์ที่ผ่านมามากที่สุด ทุกคำตอบเป็นความลับ</p>
      <div class="progress-bar"><div class="progress-fill" style="width:${(answeredCount / questions.length) * 100}%"></div></div>
      <div class="card" id="question-list">${questionsHtml()}</div>
      <p class="error-text" id="form-error" hidden></p>
      <button class="btn btn-block" id="submit-btn" ${answeredCount === questions.length ? "" : "disabled"}>
        ส่งคำตอบ (${answeredCount}/${questions.length})
      </button>
    `);

    app.querySelectorAll(".option-pill").forEach((btn) =>
      btn.addEventListener("click", () => {
        answers[Number(btn.dataset.qno)] = Number(btn.dataset.value);
        paint();
      })
    );

    const submitBtn = app.querySelector("#submit-btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = "กำลังส่งและวิเคราะห์ผล...";
        try {
          const payload = { answers: Object.entries(answers).map(([question_no, option_value]) => ({ question_no: Number(question_no), option_value })) };
          const data = await api("POST", "/assessments", payload);
          showToast("🙏 ขอบคุณที่สละเวลาทำแบบประเมินนะคะ", 1000);
          navigate("result", { id: data.assessment_id });
        } catch (err) {
          const errorEl = app.querySelector("#form-error");
          errorEl.textContent = err.message;
          errorEl.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "ส่งคำตอบอีกครั้ง";
        }
      });
    }
  }

  paint();
}

}

async function renderChat() {
  wrap(`<p class="subtitle">กำลังเริ่มบทสนทนา...</p>`);
  const conversation = await api("POST", "/chat/conversations");
  const messages = [{ message_id: "welcome", sender: "ai", content: "สวัสดีครับ ผมพร้อมรับฟังคุณอยู่ตรงนี้ วันนี้อยากเล่าอะไรให้ฟังบ้างไหมครับ?" }];
  let showHotline = false;
  const BUBBLE_DELAY_MS = 500; // หน่วงระหว่างกล่องข้อความของบอท (เดิม 700)
  let sending = false;
  let satisfactionPrompted = false; // ถามไปแล้วหรือยัง (ถามแค่ครั้งเดียวต่อบทสนทนา)
  let satisfactionResolved = false; // ตอบ (หรือกดข้าม) แล้ว ไม่ต้องโชว์การ์ดอีก
  let satisfactionSubmitting = false;

  function paint() {
    const userMessageCount = messages.filter((m) => m.sender === "user").length;
    const showSatisfaction = satisfactionPrompted && !satisfactionResolved;

    wrap(`
      <h1>แชทบอทรับฟัง</h1>
      <p class="subtitle">พื้นที่ปลอดภัยสำหรับระบายความรู้สึก บทสนทนานี้เป็นความลับ</p>
      ${showHotline ? hotlineBannerHtml() : ""}
      <div class="card">
        <div class="chat-window" id="chat-window">
          ${messages
            .map((m) => `<div class="msg ${m.sender === "user" ? "user" : "ai"}">${escapeHtml(m.content)}</div>${actionCardsHtml(m.action_cards)}`)
            .join("")}
          ${sending ? `<div class="msg ai">กำลังพิมพ์...</div>` : ""}
        </div>
        <p class="error-text" id="form-error" hidden></p>
        <form class="chat-input-row" id="chat-form">
          <input id="chat-input" placeholder="พิมพ์ข้อความของคุณที่นี่..." autocomplete="off" />
          <button class="btn" type="submit" ${sending ? "disabled" : ""}>ส่ง</button>
        </form>
      </div>
      ${showSatisfaction ? satisfactionCardHtml() : ""}
    `);
    const chatWindow = app.querySelector("#chat-window");
    if (chatWindow) chatWindow.scrollTop = chatWindow.scrollHeight;

    if (showSatisfaction) {
      const card = app.querySelector("#satisfaction-card");
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });

      app.querySelectorAll(".satisfaction-pill").forEach((btn) =>
        btn.addEventListener("click", async () => {
          if (satisfactionSubmitting) return;
          satisfactionSubmitting = true;
          try {
            await api("POST", `/chat/conversations/${conversation.conversation_id}/satisfaction`, { bucket: btn.dataset.bucket });
          } catch (err) {
            // ให้คะแนนไม่สำเร็จก็ไม่ต้องรบกวนผู้ใช้ต่อ แค่ปิดการ์ดไปเงียบๆ พอ
            console.warn("ส่งคะแนนความพึงพอใจไม่สำเร็จ:", err.message);
          } finally {
            satisfactionSubmitting = false;
            satisfactionResolved = true;
            paint();
          }
        })
      );

      const skipBtn = app.querySelector("#satisfaction-skip");
      if (skipBtn) skipBtn.addEventListener("click", () => {
        satisfactionResolved = true;
        paint();
      });
    }

    app.querySelector("#chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = app.querySelector("#chat-input");
      const text = input.value.trim();
      if (!text || sending) return;

      messages.push({ message_id: `local-${Date.now()}`, sender: "user", content: text });
      sending = true;
      paint();

      try {
        const t0 = performance.now();
        const data = await api("POST", `/chat/conversations/${conversation.conversation_id}/messages`, { content: text });
        console.log(`[jaidee] เซิร์ฟเวอร์ตอบใน ${Math.round(performance.now() - t0)} ms`);
        showHotline = data.show_hotline_banner;
        // คำตอบอาจมีหลายกล่อง: ทยอยโผล่ทีละกล่อง (หน่วงสั้นๆ) ให้เหมือนคนพิมพ์ส่งทีละข้อความ
        const aiMessages = data.ai_messages || [data.ai_message];
        // ปุ่ม action cards แสดงใต้กล่องสุดท้ายของคำตอบรอบนี้
        const cards = (data.user_response && data.user_response.action_cards) || [];
        if (cards.length > 0) aiMessages[aiMessages.length - 1] = { ...aiMessages[aiMessages.length - 1], action_cards: cards };
        // v17: กล่องแรกโผล่ทันที กล่องถัดไปหน่วงสั้นลง (500 ms) และแสดง "กำลังพิมพ์..." ระหว่างรอ ไม่ให้ดูเหมือนค้าง
        for (let i = 0; i < aiMessages.length; i++) {
          messages.push(aiMessages[i]);
          sending = i < aiMessages.length - 1; // ยังมีกล่องต่อไป -> โชว์กำลังพิมพ์
          paint();
          if (i < aiMessages.length - 1) {
            await new Promise((resolve) => setTimeout(resolve, BUBBLE_DELAY_MS));
          }
        }

        const sentCount = messages.filter((m) => m.sender === "user").length;
        if (sentCount >= SATISFACTION_TRIGGER_COUNT && !satisfactionPrompted) {
          satisfactionPrompted = true;
        }
      } catch (err) {
        const errorEl = app.querySelector("#form-error");
        if (errorEl) {
          errorEl.textContent = err.message;
          errorEl.hidden = false;
        }
      } finally {
        sending = false;
        paint();
      }
    });
  }

  paint();
}

async function renderSettings() {
  wrap(`<p class="subtitle">กำลังโหลด...</p>`);
  const prefs = await api("GET", "/notifications/preferences");
  const research = await api("GET", "/research/consent").catch(() => null);

  wrap(`
    <h1>ตั้งค่าการแจ้งเตือน</h1>
    <p class="subtitle">เลือกวันและเวลาที่สะดวกให้แอปเตือนคุณทำแบบประเมิน 9Q ทุกสัปดาห์</p>
    <div class="card">
      <form id="settings-form">
        <div class="field field-checkbox">
          <input type="checkbox" id="reminder_enabled" ${prefs.reminder_enabled ? "checked" : ""} />
          <label for="reminder_enabled" style="margin:0">เปิดการแจ้งเตือนรายสัปดาห์</label>
        </div>
        <div class="field">
          <label>วันที่แจ้งเตือน</label>
          <select name="day_of_week">
            ${DAY_LABELS.map((label, idx) => `<option value="${idx}" ${idx === prefs.day_of_week ? "selected" : ""}>${label}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>เวลาที่แจ้งเตือน</label>
          <input type="time" name="time_of_day" value="${(prefs.time_of_day || "19:00").slice(0, 5)}" />
        </div>
        <p class="error-text" id="form-error" hidden></p>
        <button class="btn" type="submit">บันทึกการตั้งค่า</button>
        <span id="saved-msg" style="margin-left:0.8rem;color:var(--accent);font-size:0.88rem" hidden>บันทึกแล้ว ✓</span>
      </form>
    </div>
    ${research ? `
    <h2>การเก็บข้อมูลเพื่อการวิจัย</h2>
    <div class="card">
      <p class="subtitle" style="margin-top:0">${research.research_consent
        ? "ตอนนี้คุณ<strong>ยินยอม</strong>ให้เก็บข้อความแชทและผลประเมิน (ลบข้อมูลที่ระบุตัวตนออกแล้ว) เพื่อวัดผลโครงงาน"
        : "ตอนนี้ระบบ<strong>ไม่ได้เก็บ</strong>ข้อมูลการใช้งานของคุณ"}</p>
      <button class="btn btn-secondary" id="research-toggle" type="button">${research.research_consent ? "หยุดให้เก็บข้อมูล" : "เปลี่ยนเป็นยินยอม"}</button>
      <p class="subtitle" style="font-size:0.82rem">หยุดให้เก็บแล้ว ข้อมูลใหม่จะไม่ถูกเก็บอีก ถ้าอยากให้ลบข้อมูลที่เก็บไปแล้ว ติดต่อผู้พัฒนาโครงงาน</p>
    </div>` : ""}
  `);
  const toggle = app.querySelector("#research-toggle");
  if (toggle) toggle.addEventListener("click", async () => {
    if (research.research_consent) {
      const choice = { research_consent: false, age_band: research.age_band, guardian_ack: false };
      await api("PUT", "/research/consent", choice);
      saveResearchChoice(choice);
      renderSettings();
    } else {
      // ขอความยินยอมใหม่ผ่านหน้าเดิม (ต้องเลือกอายุ/ผู้ปกครองอีกครั้ง) แล้วส่งให้เซิร์ฟเวอร์ตอนกลับมา
      state.research = null;
      try { localStorage.removeItem("research_choice"); } catch (e) { /* ignore */ }
      state.pendingResearchSync = true;
      app.innerHTML = "";
      renderConsent();
    }
  });

  app.querySelector("#settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const errorEl = app.querySelector("#form-error");
    const savedEl = app.querySelector("#saved-msg");
    errorEl.hidden = true;
    savedEl.hidden = true;
    try {
      await api("PUT", "/notifications/preferences", {
        reminder_enabled: app.querySelector("#reminder_enabled").checked,
        day_of_week: Number(form.get("day_of_week")),
        time_of_day: form.get("time_of_day"),
      });
      savedEl.hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    }
  });
}
